# Cloudflare Pages config.
#
# The KV namespace binding (PHARMABRO_KV) and ADMIN_TOKEN secret are set in the
# Cloudflare Pages dashboard (Settings → Functions → KV namespace bindings, and
# Settings → Environment variables). Don't put them here — keeping them in the
# dashboard avoids committing a project-specific namespace id to the repo.

name = "pharmabro"
compatibility_date = "2025-05-01"
pages_build_output_dir = "dist"
