# Cloudflare Pages config — binds the KV namespace + admin token to the Pages
# project so the Functions in /functions can access them as env.PHARMABRO_KV
# and env.ADMIN_TOKEN.
#
# After creating the KV namespace in the dashboard or via:
#   wrangler kv namespace create PHARMABRO_KV
# replace the placeholder id below with the real one, OR set the binding in the
# Cloudflare Pages dashboard (Settings → Functions → KV namespace bindings).

name = "pharmabro"
compatibility_date = "2025-05-01"
pages_build_output_dir = "dist"

# KV binding — same name (PHARMABRO_KV) is used in functions/_utils.js.
[[kv_namespaces]]
binding = "PHARMABRO_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Admin token for /api/admin/* endpoints.
# Set this in the Pages dashboard under "Environment variables" → "Production"
# rather than committing it here. Local dev fallback only:
# [vars]
# ADMIN_TOKEN = "dev-only-change-me"
